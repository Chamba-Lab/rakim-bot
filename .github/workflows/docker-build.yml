name: Docker build

# Comprueba que la imagen se construye; no la publica. Solo corre cuando cambia algo que
# puede romperla (el Dockerfile, las dependencias o este workflow): el resto de PRs no la
# necesita. No es un check obligatorio mientras el despliegue esté apagado.
on:
    pull_request:
        branches:
            - master
        types: [opened, synchronize, reopened]
        paths:
            - Dockerfile
            - .dockerignore
            - pyproject.toml
            - uv.lock
            - .github/workflows/docker-build.yml

permissions:
    contents: read

concurrency:
    group: docker-build-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    docker:
        name: Docker build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build image
              run: docker build --pull --tag rakim-bot:ci .
