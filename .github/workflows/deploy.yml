name: Deploy

# Al fusionar en master: valida, construye la imagen y la despliega en el Droplet de
# DigitalOcean. La imagen viaja por SSH (`docker save | ssh docker load`), así que no
# hace falta un registro de imágenes ni guardar credenciales de registro en el servidor.
# DESHABILITADO POR DEFECTO: solo corre si la variable DEPLOY_ENABLED vale "true".
# Configuración necesaria en GitHub (Settings > Secrets and variables > Actions):
#   variables: DEPLOY_ENABLED, DEPLOY_HOST, DEPLOY_USER
#   secretos:  DEPLOY_SSH_KEY (llave privada del CD), DEPLOY_KNOWN_HOSTS (huella del servidor)
# El paso a paso está en docs/deployment.md.

on:
    push:
        branches:
            - master
        # Un cambio solo de documentación no reinicia el bot.
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - ".github/pull_request_template.md"
    workflow_dispatch:

permissions:
    contents: read

# Un despliegue a la vez, sin cancelar el que esté en curso: cortarlo a medias podría
# dejar el contenedor sin actualizar.
concurrency:
    group: production
    cancel-in-progress: false

jobs:
    validate:
        name: Validate
        # Interruptor: mientras la variable DEPLOY_ENABLED no valga "true", este flujo no
        # hace nada (ni al fusionar en master ni a mano). Se activa con:
        #   gh variable set DEPLOY_ENABLED --body "true"
        if: vars.DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"

            - name: Install uv
              run: python -m pip install uv==0.13.5

            - name: Install dependencies
              env:
                  UV_PYTHON_DOWNLOADS: never
                  UV_PYTHON_PREFERENCE: only-system
              run: |
                  uv lock --check
                  uv sync --frozen

            - name: Lint, types and tests
              run: |
                  uv run ruff check .
                  uv run ruff format --check .
                  uv run mypy
                  uv run pytest

    deploy:
        name: Deploy to DigitalOcean
        needs: validate
        # Misma condición que arriba, por si alguien quita `validate`: el despliegue nunca corre apagado.
        if: vars.DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        environment: production
        env:
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_USER: ${{ vars.DEPLOY_USER }}
            APP_DIR: /opt/rakim-bot
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # `--pull` trae la base más reciente de Python 3.13, con los últimos parches de seguridad.
            - name: Build image
              run: docker build --pull --tag rakim-bot:latest .

            # La huella del servidor va fijada: si cambia, la conexión falla en vez de confiar a ciegas.
            - name: Configure SSH
              env:
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  cat > ~/.ssh/config <<EOF
                  Host rakim-server
                      HostName $DEPLOY_HOST
                      User $DEPLOY_USER
                      IdentityFile ~/.ssh/deploy_key
                      IdentitiesOnly yes
                      StrictHostKeyChecking yes
                  EOF

            - name: Upload compose file
              run: scp deploy/compose.yml "rakim-server:$APP_DIR/compose.yml"

            - name: Load image and restart
              run: |
                  docker save rakim-bot:latest | gzip | ssh rakim-server \
                      "gunzip | docker load && cd $APP_DIR && docker compose up -d --remove-orphans && docker image prune -f"

            # Si el bot no queda corriendo (por ejemplo, un .env incompleto), el despliegue falla en rojo.
            - name: Verify
              run: |
                  sleep 20
                  ssh rakim-server "cd $APP_DIR && docker compose ps && docker compose logs --tail 20 rakim"
                  ssh rakim-server "cd $APP_DIR && docker compose ps --status running --quiet rakim | grep -q ."
